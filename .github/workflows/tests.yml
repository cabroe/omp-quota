name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ein neuer Push auf denselben Branch macht den laufenden Lauf überflüssig.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bun:
    name: bun test
    runs-on: ubuntu-latest
    # Fängt hängende Runner ab — der Timeout-Fall der Suite dauert ~2 s,
    # alles darüber deutet auf einen hängenden Prozess oder Runner hin.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun test